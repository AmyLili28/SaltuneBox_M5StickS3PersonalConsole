[platformio]
default_envs = m5stick-s3

[env:m5stick-s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 115200
upload_flags =
  --before
  usb_reset
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_ldf_mode = deep+
lib_extra_dirs = lib
